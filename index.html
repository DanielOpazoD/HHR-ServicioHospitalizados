<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HHR Hospital Tracker</title>
    <style>
        html,
        body,
        #root {
            min-height: 100vh;
        }

        body {
            margin: 0;
            background-color: #eef4f8;
            color: #0f172a;
        }

        #root {
            position: relative;
            z-index: 1;
        }

        #boot-surface {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 1;
            visibility: visible;
            background-color: #eef4f8;
            transition: opacity 140ms ease-out, visibility 140ms ease-out;
        }

        #boot-surface.is-hidden {
            opacity: 0;
            visibility: hidden;
        }

        html[data-preboot-surface="login"] body {
            background-color: #020617;
        }

        html[data-preboot-surface="app"] body {
            background-color: #eef4f8;
        }

        html[data-preboot-surface="login"] #boot-surface {
            background-color: #020617;
        }

        html[data-preboot-surface="app"] #boot-surface {
            background-color: #eef4f8;
        }
    </style>
    <script>
        (function () {
            var normalizedPath = window.location.pathname.replace(/^\/+|\/+$/g, '');
            var isLoginSurface = normalizedPath === '' || normalizedPath === 'login';
            document.documentElement.dataset.prebootSurface = isLoginSurface ? 'login' : 'app';
        })();
    </script>
    <!-- PWA -->
    <meta name="theme-color" content="#0284c7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HHR">
    <link rel="icon" type="image/svg+xml" href="/images/logos/logo_HHR.svg">
    <link rel="shortcut icon" href="/images/logos/logo_HHR.svg">
    <link rel="apple-touch-icon" href="/images/icon-192.png">

    <link rel="stylesheet" href="/src/index.css">

    <!-- Google Identity Services (GSI) -->
    <!-- Firebase Auth popups handle their own communication, GSI is redundant and can conflict -->
</head>

<body class="text-slate-900">
    <div id="boot-surface" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>

</html>
