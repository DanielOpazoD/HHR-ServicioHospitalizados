name: Preview Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-preview-bootstrap:
    name: Validate Preview Bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Install Playwright browsers for preview validation
        run: npx playwright install --with-deps chromium

      - name: Run local preview bootstrap smoke
        run: npm run test:e2e:preview:census-bootstrap:built
        env:
          CI: true
          PLAYWRIGHT_SKIP_PREVIEW_BUILD: '1'

      - name: Upload preview validation artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-validation-artifacts
          path: |
            playwright-report/**
            test-results/**
          retention-days: 14
